<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>counter app</title>
    <link rel="stylesheet" href="/CSS/counter.css">
  </head>

  <body>
    <div class="counter-container">
      <h1>Counter app</h1>
      <p id="count">0</p>
      
      <div class="buttons">
        <button id="increase">+</button>
        <button id="decrease">-</button>
        <button id="reset">Reset</button>
      </div>
    </div>

    <script src="counter.js"></script>

  </body>
</html>
